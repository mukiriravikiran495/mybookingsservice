spring.application.name=mybookingsservice


# Database

# Database
db.driver: oracle.jdbc.driver.OracleDriver
db.url: jdbc:oracle:thin:@localhost:1521/orclpdb
db.username: MyBOOKINGS
db.password: password
server.port=8282
# Hibernate

hibernate.dialect: org.hibernate.dialect.OracleDialect
hibernate.show_sql: true
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
#hibernate.hbm2ddl.auto: update

spring.jackson.date-format=dd-MMM-yyyy HH:mm:ss.SSS
spring.jackson.time-zone=UTC

logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.apache.http=DEBUG

customer.service.url=http://localhost:8181/v1/api/customer
vendor.service.url=http://localhost:8181/v1/api/vendor